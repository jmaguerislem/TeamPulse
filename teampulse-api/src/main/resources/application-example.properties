spring.application.name=teampulse-api
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5433/teampulse
spring.datasource.username=postgres
spring.datasource.password=CHANGE_MOI

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Clé secrète des jetons : au moins 32 caractères, à changer
app.jwt.secret=CHANGE_MOI_PAR_UNE_LONGUE_PHRASE_SECRETE_DE_32_CARACTERES_MINIMUM
app.jwt.expiration-days=30

# Pièces jointes
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB